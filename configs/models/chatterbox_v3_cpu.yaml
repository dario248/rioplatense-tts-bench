# chatterbox_v3_cpu — el mismo modelo de configs/models/chatterbox_v3.yaml, medido en CPU para el eje de costo (SPEC 6.3).
#
# OJO: los `params` estan DUPLICADOS de configs/models/chatterbox_v3.yaml. Si alguno cambia alla y no aca, las dos
# plataformas dejan de medir el mismo modelo y la comparacion GPU/CPU miente sin avisar.
#
# Los threads no van en el config: se fijan con OMP_NUM_THREADS al invocar, y quedan registrados
# en el `_resources.json` que la corrida escribe al lado de su manifest.

name: chatterbox_v3_cpu
adapter: rtb.generate.chatterbox:ChatterboxAdapter
hf_repo: ResembleAI/chatterbox
model_revision: 5bb1f6ee58e50c3b8d408bc82a6d3740c2db6e18
max_ref_seconds: 6.0
supports_streaming: false
default_sample_rate: 24000
device: cpu
audio_root: audio
manifest_path: data/latency/chatterbox_v3_cpu.jsonl
params:
  language_id: es
  exaggeration: 0.5
  cfg_weight: 0.5
  temperature: 0.8
  repetition_penalty: 2.0
  min_p: 0.05
  top_p: 1.0
