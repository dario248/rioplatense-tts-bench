# qwen3_tts_cpu — el mismo modelo de configs/models/qwen3_tts.yaml, medido en CPU para el eje de costo (SPEC 6.3).
#
# OJO: los `params` estan DUPLICADOS de configs/models/qwen3_tts.yaml. Si alguno cambia alla y no aca, las dos
# plataformas dejan de medir el mismo modelo y la comparacion GPU/CPU miente sin avisar.
#
# Los threads no van en el config: se fijan con OMP_NUM_THREADS al invocar, y quedan registrados
# en el `_resources.json` que la corrida escribe al lado de su manifest.

name: qwen3_tts_cpu
adapter: rtb.generate.qwen3:Qwen3Adapter
hf_repo: Qwen/Qwen3-TTS-12Hz-1.7B-Base
model_revision: fd4b254389122332181a7c3db7f27e918eec64e3
requires_ref_text: true
max_ref_seconds: 12.0
supports_streaming: false
default_sample_rate: 24000
device: cpu
audio_root: audio
manifest_path: data/latency/qwen3_tts_cpu.jsonl
params:
  language: Spanish
  x_vector_only_mode: false
  non_streaming_mode: true
  dtype: bfloat16
  max_new_tokens: 2048
  attn_implementation: null
